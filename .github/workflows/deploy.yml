name: Build and deploy website

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Build website
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --trace
      - name: Check required pages
        run: |
          for page in index.html research/index.html publications/index.html teaching/index.html group/index.html cv/index.html; do
            test -s "_site/$page" || exit 1
          done
          test -s _site/assets/css/main.css
          test -s _site/assets/img/semih-cayci.jpg
      - name: Upload website
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
